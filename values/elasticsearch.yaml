clusterName: elasticsearch
nodeGroup: master

replicas: 1
minimumMasterNodes: 1
antiAffinity: soft
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

esJavaOpts: "-Xms1g -Xmx1g"
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1000m
    memory: 2Gi

sysctlInitContainer:
  enabled: false
esConfig:
  elasticsearch.yml: |
    node.store.allow_mmap: false

protocol: https
createCert: true
secret:
  enabled: true

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

rbac:
  create: false
  automountToken: false
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  runAsNonRoot: true
  runAsUser: 1000

networkPolicy:
  http:
    enabled: true
    additionalRules:
      - podSelector:
          matchLabels:
            job-name: pre-install-kibana-kibana

nodeSelector:
  role: logging
tolerations:
  - key: dedicated
    operator: Equal
    value: logging
    effect: NoSchedule

tests:
  enabled: false
