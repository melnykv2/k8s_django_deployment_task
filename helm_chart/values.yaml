config:
  DB: "postgres"
  DB_HOST: "healthchecks-db.cwv2a4uw41qv.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "hc"
  DB_USER: "hc"
  DB_SSLMODE: "require"
  DEBUG: "False"
  SITE_ROOT: "https://hc.vadymthebest.com"
  ALLOWED_HOSTS: "hc.vadymthebest.com,localhost"

# Real values are passed in secrets-values.yaml
secrets: {}

replicaCount: 2
image:
  repository: melnykv2/healthchecks
  tag: v1.4
containerPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80


ingress:
  className: nginx
  host: hc.vadymthebest.com
  clusterIssuer: letsencrypt-prod

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

letsencrypt:
  email: "info@vadymthebest.com"

storage:
  className: efs-sc
  size: 1Gi
  efsFileSystemId: fs-0cc86d4f443ff2550
  efsAccessPointId: fsap-0fe313921b7059620
  staticPath: /app/static-collected
