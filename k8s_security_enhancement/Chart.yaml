apiVersion: v2
name: django-app
description: Helm chart for deploying a Django application to Kubernetes (AWS EKS)
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - django
  - python
  - web
maintainers:
  - name: Vadym Melnyk

dependencies:
  - name: ingress-nginx
    version: 4.8.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: v1.13.1
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  - name: metrics-server
    version: 3.11.0
    repository: https://kubernetes-sigs.github.io/metrics-server/
    condition: metrics-server.enabled
