# Real values are passed in helm_secrets/django_config.yaml
config: {}

# Real values are passed in helm_secrets/django_secret.yaml
secrets: {}

replicaCount: 2
namespace:
  name: healthchecks
serviceAccount:
  name: healthchecks
  automountServiceAccountToken: false
image:
  repository: melnykv2/healthchecks
  tag: v1.4
containerPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80


ingress:
  className: nginx
  host: hc.vadymthebest.com
  clusterIssuer: letsencrypt-prod

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

letsencrypt:
  email: "info@vadymthebest.com"

networkPolicy:
  databaseCidr: 192.168.0.0/16

ingress-nginx:
  enabled: true
  controller:
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
    admissionWebhooks:
      enabled: false

cert-manager:
  enabled: true
  namespace: cert-manager
  installCRDs: true

metrics-server:
  enabled: false
