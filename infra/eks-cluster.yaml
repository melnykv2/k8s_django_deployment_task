apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: healthchecks
  region: us-east-1

vpc:
  nat:
    gateway: Disable

iam:
  withOIDC: true
addons:
  - name: vpc-cni
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
    configurationValues: '{"enableNetworkPolicy": "true"}'
  - name: coredns
  - name: kube-proxy
  - name: metrics-server

managedNodeGroups:
  - name: default
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: false
