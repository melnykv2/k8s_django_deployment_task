# Real values are passed in helm_secrets/django_config.yaml
config: {}

# Real values are passed in helm_secrets/django_secret.yaml
secrets: {}

replicaCount: 2
image:
  repository: melnykv2/healthchecks
  tag: v1.4
containerPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80


ingress:
  className: nginx
  host: hc.vadymthebest.com
  clusterIssuer: letsencrypt-prod

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

letsencrypt:
  email: "info@vadymthebest.com"
