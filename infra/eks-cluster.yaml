apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: healthchecks
  region: us-east-1

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: default
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: false

iam:
  withOIDC: true
addons:
  - name: aws-efs-csi-driver
    wellKnownPolicies:
      efsCSIController: true
